<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>
</head>
<body>
    <h1>Đăng nhập</h1>
    <form method="post">
        {% csrf_token %}
        <label for="id_username">Tên đăng nhập:</label>
        <input type="text" name="username" id="id_username" value="{{ form.username.value|default_if_none:'' }}">
        {% if form.username.errors %}
            <div style="color:red;">{{ form.username.errors.0 }}</div>
        {% endif %}

        <label for="id_password">Mật khẩu:</label>
        <input type="password" name="password" id="id_password">
        {% if form.password.errors %}
            <div style="color:red;">{{ form.password.errors.0 }}</div>
        {% endif %}

        <button type="submit">Đăng nhập</button>
    </form>
    {% if form.errors %}
        <p style="color:red;">Sai tài khoản hoặc mật khẩu!</p>
    {% endif %}
    <p><a href="{% url 'product_list' %}">Quay lại trang sản phẩm</a></p>
</body>
</html>
